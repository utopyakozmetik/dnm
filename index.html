<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video + Lyrics + Background</title>

<script defer src="https://va.vercel-scripts.com/v1/script.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  height:100vh;
  display:flex;
  background:black;
  font-family:"Segoe UI", sans-serif;
  color:white;
  overflow:hidden;
  flex-direction:row; /* masaüstünde yatay */
}

/* SOL VIDEO */
.left-side {
  flex:1;
  margin:10px;
  border-radius:12px;
  overflow:hidden;
}
.left-side video {
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:12px;
}

/* LYRICS ORTA */
.lyrics {
  flex:1;
  background:rgba(20,20,20,0.85);
  padding:60px 40px 40px 40px;
  border-radius:12px;
  line-height:1.6;
  white-space:pre-line;
  text-align:left;
  box-shadow:0 8px 20px rgba(0,0,0,0.7);
  border:1px solid rgba(255,255,255,0.2);
  margin:10px;
  overflow:auto;
  animation: textGlow 3s infinite alternate;
  position:relative;
}

/* BUTON */
#playPauseBtn {
  position:absolute;
  top:10px;
  right:10px;
  padding:14px 28px;
  font-size:18px;
  background:rgba(0,0,0,0.7);
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
#playPauseBtn:hover {
  background:rgba(255,255,255,0.2);
}

/* SAĞ VIDEO ALANI */
.right-side {
  flex:1;
  margin:10px;
  border-radius:12px;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.7);
  border:1px solid rgba(255,255,255,0.2);
  overflow:hidden;
}
.right-side video {
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:12px;
}

/* EFEKTLER */
@keyframes textGlow {
  0% { text-shadow:0 0 5px #fff; }
  50% { text-shadow:0 0 20px #ff00ff, 0 0 40px #00ffff; }
  100% { text-shadow:0 0 10px #fff; }
}

/* 📱 Mobil uyum */
@media (max-width: 768px) {
  body {
    flex-direction: column; /* mobilde dikey */
    overflow:auto;
    height:auto;
  }

  .left-side,
  .lyrics,
  .right-side {
    flex:none;
    width:100%;
    height:auto;
    margin:5px 0;
  }

  .left-side video {
    height:auto;
    max-height:40vh;
    object-fit:cover;
  }

  .lyrics {
    padding:20px;
    font-size:14px;
    line-height:1.4;
  }

  #playPauseBtn {
    font-size:14px;
    padding:8px 16px;
  }

  .right-side {
    min-height:40vh;
  }
}
</style>
</head>
<body>

  <!-- SOL VIDEO -->
  <div class="left-side">
    <video id="bgVideo" autoplay loop controls playsinline>
      <source src="assets/video.mp4" type="video/mp4">
    </video>
  </div>

  <!-- LYRICS ORTA -->
  <div class="lyrics">
    <button id="playPauseBtn">Pause</button>
    YAKLAŞIK BİR YILDIR SAYISI 10U GEÇEN KİŞİNİN YAŞATTIĞI İĞRENÇLİKLERİN YARATTIĞI BULANTI...
    <!-- senin verdiğin metin burada -->
  </div>

  <!-- SAĞ VIDEO ALANI -->
  <div class="right-side">
    <video id="video3" autoplay loop controls playsinline>
      <source src="assets/video3.mp4" type="video/mp4">
    </video>
  </div>

<script>
const video = document.getElementById('bgVideo');
const btn = document.getElementById('playPauseBtn');

/* PLAY / PAUSE sadece sol video için */
btn.addEventListener('click', () => {
  if(video.paused){
    video.play();
    btn.textContent = "Pause";
  } else {
    video.pause();
    btn.textContent = "Play";
  }
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sola bg.jpg + Ortada Lyrics + Sağa background.jpg</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  height:100vh;
  display:flex;
  background:black;
  font-family:"Segoe UI", sans-serif;
  color:white;
  overflow:hidden; /* slider vs çıkmasın */
}

/* Sol görsel */
.left-side {
  flex:1;
  background:url('assets/bg.jpg') no-repeat center center;
  background-size:contain;
  margin:10px;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,0.7);
  animation: bgPulse 6s infinite alternate;
}

/* Ortadaki lyrics kutusu */
.lyrics {
  flex:1;
  background:rgba(20,20,20,0.75);
  padding:40px;
  border-radius:12px;
  line-height:1.6;
  white-space:pre-line;
  text-align:left;
  box-shadow:0 8px 20px rgba(0,0,0,0.7);
  border:1px solid rgba(255,255,255,0.2);
  margin:10px;
  overflow:auto;
  animation: textGlow 3s infinite alternate;
}

/* Sağ görsel */
.right-side {
  flex:1;
  background:url('assets/background.jpg') no-repeat center center;
  background-size:contain;
  margin:10px;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,0.7);
  animation: bgPulse 6s infinite alternate;
}

/* Play/Pause butonu */
#playPauseBtn {
  position:fixed;
  top:20px;
  left:20px;
  padding:10px 20px;
  background:rgba(0,0,0,0.7);
  color:white;
  border:none;
  border-radius:5px;
  cursor:pointer;
  transition:background 0.3s;
}
#playPauseBtn:hover {
  background:rgba(255,255,255,0.2);
}

/* Efektler */
@keyframes bgPulse {
  0% { filter:brightness(1) saturate(1) scale(1); }
  25% { filter:brightness(1.2) saturate(1.3) hue-rotate(20deg); transform:scale(1.02); }
  50% { filter:brightness(0.9) saturate(0.8) hue-rotate(-20deg); transform:scale(0.98); }
  75% { filter:brightness(1.1) saturate(1.2) hue-rotate(40deg); transform:scale(1.03); }
  100% { filter:brightness(1) saturate(1) scale(1); }
}

@keyframes textGlow {
  0% { text-shadow:0 0 5px #fff; }
  50% { text-shadow:0 0 15px #ff00ff, 0 0 30px #00ffff; }
  100% { text-shadow:0 0 8px #fff; }
}
</style>
</head>
<body>

<div class="left-side"></div>

<div class="lyrics">
Buraya tüm sözleri eksiksiz yapıştır.
</div>

<div class="right-side"></div>

<audio id="bgMusic" autoplay loop>
  <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<button id="playPauseBtn">Pause</button>

<script>
const audio = document.getElementById('bgMusic');
const btn = document.getElementById('playPauseBtn');

btn.addEventListener('click', () => {
  if(audio.paused){
    audio.play();
    btn.textContent = "Pause";
  } else {
    audio.pause();
    btn.textContent = "Play";
  }
});
</script>

</body>
</html>

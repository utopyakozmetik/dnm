<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
  background:black;
  overflow-x:hidden;
  font-family:"Segoe UI",sans-serif;
  color:white;
}

body{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  padding:10px;
}

/* section */

.section{
  position:relative;
  overflow:hidden;
  border-radius:12px;
  background:black;
  min-height:24vh;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* media */

.section img,
.section video,
.section iframe{
  width:100%;
  height:100%;
  object-fit:contain;
  background:black;
  border:none;
}

/* text */

.textBox{
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  max-height:40%;
  overflow-y:auto;
  padding:10px;
  font-size:14px;
  background:rgba(0,0,0,0.55);
  backdrop-filter:blur(4px);
  z-index:3;
}

/* hidden audio */

.section audio{
  display:none;
}

/* music button */

.playPauseBtn{
  position:absolute;
  top:10px;
  right:10px;
  z-index:5;

  border:none;
  border-radius:8px;

  padding:7px 12px;

  background:rgba(0,0,0,0.75);
  color:white;

  cursor:pointer;
  font-size:13px;
}

/* placeholder */

.video-placeholder{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:48px;
  color:white;
  background:black;

  transition:0.25s;
}

.video-placeholder:hover{
  transform:scale(1.05);
}

/* mobile */

@media (max-width:768px){

  body{
    grid-template-columns:1fr;
  }

  .section{
    min-height:36vh;
  }

}

</style>

<script>

/* music buttons */

document.querySelectorAll(".playPauseBtn").forEach(btn=>{

  btn.addEventListener("click",(e)=>{

    e.stopPropagation();

    const audio=document.getElementById(btn.dataset.target);

    if(!audio) return;

    if(audio.paused){

      audio.play();
      btn.textContent="Müzik Kapat";

    }else{

      audio.pause();
      btn.textContent="Müzik Aç";

    }

  });

});

/* txt load */

for(let i=1;i<=16;i++){

  fetch(`assets/t${i}.txt`)
    .then(res=>{

      if(!res.ok){
        throw new Error("txt yok");
      }

      return res.text();

    })
    .then(text=>{

      const el=document.getElementById(`t${i}`);

      if(el){
        el.textContent=text;
      }

    })
    .catch(()=>{});

}

/* lazy iframe */

document.querySelectorAll(".video-box").forEach(box=>{

  box.addEventListener("click",function(){

    if(this.querySelector("iframe")){

      openFullscreen(this);
      return;

    }

    const iframe=document.createElement("iframe");

    iframe.src=this.dataset.src + "?autoplay=false";

    iframe.allow=
      "accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen";

    iframe.allowFullscreen=true;

    iframe.style.width="100%";
    iframe.style.height="100%";
    iframe.style.border="none";

    this.innerHTML="";
    this.appendChild(iframe);

  });

});

/* fullscreen */

function openFullscreen(el){

  const iframe=el.querySelector("iframe");

  if(iframe){

    if(iframe.requestFullscreen){
      iframe.requestFullscreen();
    }else if(iframe.webkitRequestFullscreen){
      iframe.webkitRequestFullscreen();
    }

    return;

  }

  const video=el.querySelector("video");

  if(video){

    if(video.requestFullscreen){
      video.requestFullscreen();
    }else if(video.webkitEnterFullscreen){
      video.webkitEnterFullscreen();
    }else if(video.webkitRequestFullscreen){
      video.webkitRequestFullscreen();
    }

    return;

  }

  const img=el.querySelector("img");

  if(img){

    if(img.requestFullscreen){
      img.requestFullscreen();
    }else if(img.webkitRequestFullscreen){
      img.webkitRequestFullscreen();
    }

  }

}

</script>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>multi licker god</title>

<script defer src="https://va.vercel-scripts.com/v1/script.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 10px;
  height: 100vh;
  background: black;
  font-family:"Segoe UI", sans-serif;
  color:white;
}

.section {
  border-radius:12px;
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
  cursor:pointer;
}

/* medya */
.section img,
.section video,
.section iframe {
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:12px;
  background:black;
  border:none;
}

.section audio { display:none; }

.textBox {
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  max-height:40%;
  padding:10px;
  overflow-y:auto;
  font-size:14px;
  background:rgba(0,0,0,0.5);
}

/* müzik butonu */
.playPauseBtn {
  position:absolute;
  top:10px;
  right:10px;
  padding:6px 12px;
  font-size:13px;
  background:rgba(0,0,0,0.7);
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
  z-index:10;
}

@media (max-width:768px) {
  body {
    grid-template-columns: 1fr;
    grid-template-rows: repeat(12, auto);
    height:auto;
  }
  .section { min-height:40vh; }
}
</style>
</head>

<body>

<!-- 1 -->
<div class="section" onclick="openFullscreen(this)">
  <video controls playsinline>
    <source src="https://res.cloudinary.com/dgyxllk35/video/upload/v1778587281/InShot_20260512_144740459_yi1mjn.mp4">
  </video>
  <audio id="m1" src="assets/m1.mp3"></audio>
  <div class="textBox" id="t1"></div>
</div>

<script>
/* müzik kontrol */
document.querySelectorAll('.playPauseBtn').forEach(btn=>{
  btn.onclick=(e)=>{
    e.stopPropagation();
    const a=document.getElementById(btn.dataset.target);
    if(a.paused){a.play();btn.textContent="Müzik Kapat";}
    else{a.pause();btn.textContent="Müzik Aç";}
  }
});

/* text yükleme */
for(let i=1;i<=12;i++){
  fetch(`assets/t${i}.txt`)
    .then(r=>r.text())
    .then(t=>{const el=document.getElementById(`t${i}`);if(el)el.textContent=t;})
    .catch(()=>{});
}

/* fullscreen */
function openFullscreen(el){
  const video=el.querySelector("video");
  const iframe=el.querySelector("iframe");
  const img=el.querySelector("img");

  if(video && video.src) return;

  if(iframe){
    iframe.requestFullscreen?.();
    return;
  }

  if(img){
    img.requestFullscreen?.();
  }
}
</script>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video + Background</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  display:flex;
  height:100vh;
  background:black;
}

/* Sol taraf video */
.video-half{
  flex:1;
  position:relative;
  overflow:hidden;
}
.video-half video{
  width:100%;
  height:100%;
  object-fit:cover;
  animation:glitch 1.5s infinite;
}

/* Yoğun glitch + pixelizasyon */
@keyframes glitch {
  0%   { transform:translate(0,0) scale(1); filter:contrast(1) saturate(1); }
  10%  { transform:translate(-4px,2px) scale(1.02); filter:hue-rotate(30deg) contrast(1.4) saturate(1.3) blur(1px); }
  20%  { transform:translate(3px,-3px) scale(0.98); filter:hue-rotate(-25deg) contrast(0.8) saturate(1.5); }
  30%  { transform:translate(-2px,1px) scale(1.05); filter:brightness(1.3) contrast(1.2) saturate(1.6) blur(2px); }
  40%  { transform:translate(2px,-2px) scale(1.01); filter:hue-rotate(15deg) contrast(1.5) saturate(1.2); }
  50%  { transform:translate(-1px,1px) scale(1.03); filter:hue-rotate(-10deg) contrast(1.1) saturate(1.4) blur(1px); }
  60%  { transform:translate(0,0) scale(1); filter:contrast(1) saturate(1); }
  100% { transform:translate(0,0) scale(1); filter:contrast(1) saturate(1); }
}

/* Play/Pause butonu ortada */
.play-btn{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  padding:14px 28px;
  background:rgba(0,0,0,0.6);
  color:white;
  font-family:'Inter', sans-serif;
  font-size:18px;
  border:1px solid rgba(255,255,255,0.7);
  border-radius:8px;
  cursor:pointer;
  z-index:10;
}

/* Sağ taraf background */
.bg-half{
  flex:1;
  position:relative;
  background:url("assets/background.jpg") center center / cover no-repeat;
}

/* Alt yazı sol alt */
.bg-half .caption{
  position:absolute;
  bottom:20px;
  left:20px;
  font-family:'Playfair Display', serif;
  font-size:28px;
  color:#4B2E2E; /* koyu sütlü kahve */
  text-shadow:0 0 6px rgba(0,0,0,0.6);
}
</style>
</head>
<body>

<div class="video-half">
  <video id="video" autoplay loop controlslist="nodownload noremoteplayback">
    <source src="assets/video.mp4" type="video/mp4">
  </video>
  <button class="play-btn" onclick="toggleVideo()">PLAY</button>
</div>

<div class="bg-half">
  <div class="caption">...sooner or later...</div>
</div>

<script>
const vid = document.getElementById("video");
const btn = document.querySelector(".play-btn");
vid.volume = 1.0; // sesi tam açık

function toggleVideo(){
  if(vid.paused){
    vid.play();
    btn.textContent = "PAUSE";
  } else {
    vid.pause();
    btn.textContent = "PLAY";
  }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video + Background</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  display:flex;
  height:100vh;
  background:black;
}

/* Sol taraf video */
.video-half{
  flex:1;
  overflow:hidden;
}
.video-half video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* Sağ taraf background */
.bg-half{
  flex:1;
  position:relative;
  background:url("assets/background.jpg") center center / cover no-repeat;
}

/* Alt yazı */
.bg-half .caption{
  position:absolute;
  bottom:20px;
  width:100%;
  text-align:center;
  font-family:'Playfair Display', serif;
  font-size:28px;
  color:white;
  letter-spacing:3px;
  text-shadow:0 0 8px rgba(0,0,0,0.8);
}
</style>
</head>
<body>

<div class="video-half">
  <video autoplay muted loop>
    <source src="assets/video.mp4" type="video/mp4">
  </video>
</div>

<div class="bg-half">
  <div class="caption">...sooner or later...</div>
</div>

</body>
</html>

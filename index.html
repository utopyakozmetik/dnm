<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video + Background</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  display:flex;
  height:100vh;
  background:black;
}

/* Sol taraf video */
.video-half{
  flex:1;
  overflow:hidden;
}
.video-half video{
  width:100%;
  height:100%;
  object-fit:cover;
  animation:glitch 2s infinite;
}

/* Glitch animasyonu */
@keyframes glitch {
  0%   { transform:translate(0,0); filter:hue-rotate(0deg) contrast(1); }
  10%  { transform:translate(-2px,2px); filter:hue-rotate(20deg) contrast(1.3); }
  20%  { transform:translate(2px,-2px); filter:hue-rotate(-20deg) contrast(0.9); }
  30%  { transform:translate(-1px,1px); filter:brightness(1.2); }
  40%  { transform:translate(1px,-1px); filter:hue-rotate(10deg) contrast(1.1); }
  50%  { transform:translate(0,0); filter:hue-rotate(-10deg); }
  100% { transform:translate(0,0); filter:hue-rotate(0deg) contrast(1); }
}

/* Sağ taraf background */
.bg-half{
  flex:1;
  position:relative;
  background:url("assets/background.jpg") center center / cover no-repeat;
}

/* Alt yazı */
.bg-half .caption{
  position:absolute;
  bottom:20px;
  left:20px;
  font-family:'Playfair Display', serif;
  font-size:28px;
  color:#4B2E2E; /* koyu sütlü kahve */
  text-shadow:0 0 6px rgba(0,0,0,0.6);
}
</style>
</head>
<body>

<div class="video-half">
  <video id="video" autoplay loop>
    <source src="assets/video.mp4" type="video/mp4">
  </video>
</div>

<div class="bg-half">
  <div class="caption">...sooner or later...</div>
</div>

<script>
const vid = document.getElementById("video");
vid.volume = 0.5; // başlangıç sesi yarım
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>debug</title>

<style>
body{
    margin:0;
    height:100vh;
    background:black;
    overflow:hidden;
}

/* BACKGROUND */
.bg{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

/* TEXT (DEBUG) */
.response{
    position:fixed;
    top:50%;
    left:200px; /* 🔥 SAĞA KAYDIRILDI */

    transform:translateY(-50%);
    font-size:64px;
    color:red;
    z-index:999;

    background:rgba(0,0,0,0.3);
    padding:10px;
}

/* BUTTON */
.button{
    position:fixed;
    top:20px;
    left:20px;
    padding:10px 20px;
    cursor:pointer;
}
</style>
</head>

<body>

<img class="bg" src="assets/background.jpg">

<div class="response" id="text">
VISIBLE TEST TEXT
</div>

<button class="button" onclick="test()">MOVE TEST</button>

<script>
const text = document.getElementById("text");

/* SADECE KAYDIRMA TESTİ */
function test(){
    text.style.left = "400px";
    text.style.color = "lime";
    text.innerText = "IT WORKS";
}

/* otomatik test */
setTimeout(()=>{
    text.style.left = "300px";
},1000);

setTimeout(()=>{
    text.style.left = "500px";
},2000);
</script>

</body>
</html>

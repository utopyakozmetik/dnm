<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video + Lyrics + Background</title>

<script defer src="https://va.vercel-scripts.com/v1/script.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  height:100vh;
  display:flex;
  background:black;
  font-family:"Segoe UI", sans-serif;
  color:white;
  overflow:hidden;
}

/* SOL VIDEO */
.left-side {
  flex:1;
  margin:10px;
  border-radius:12px;
  overflow:hidden;
}
.left-side video {
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:12px;
}

/* LYRICS ORTA */
.lyrics {
  flex:1;
  background:rgba(20,20,20,0.85);
  padding:60px 40px 40px 40px;
  border-radius:12px;
  line-height:1.6;
  white-space:pre-line;
  text-align:left;
  box-shadow:0 8px 20px rgba(0,0,0,0.7);
  border:1px solid rgba(255,255,255,0.2);
  margin:10px;
  overflow:auto;
  animation: textGlow 3s infinite alternate;
  position:relative;
}

/* BUTON */
#playPauseBtn {
  position:absolute;
  top:10px;
  right:10px;
  padding:14px 28px;
  font-size:18px;
  background:rgba(0,0,0,0.7);
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
#playPauseBtn:hover {
  background:rgba(255,255,255,0.2);
}

/* SAĞ SÖZ ALANI */
.right-side {
  flex:1;
  margin:10px;
  border-radius:12px;
  background:rgba(30,30,30,0.9);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.7);
  border:1px solid rgba(255,255,255,0.2);
}
.right-side .big-quote {
  font-size:48px;
  font-weight:bold;
  color:#ffcc00;
  text-shadow:0 0 20px rgba(255,200,0,0.8);
}
</style>
</head>
<body>

  <!-- SOL VIDEO -->
  <div class="left-side">
    <video src="assets/video.mp4" autoplay loop muted></video>
  </div>

  <!-- LYRICS ORTA -->
  <div class="lyrics">
    <button id="playPauseBtn">Pause</button>
    Şarkı sözlerini buraya yazabilirsiniz...
  </div>

  <!-- SAĞ SÖZ ALANI -->
  <div class="right-side">
    <div class="big-quote">
      GÜNÜN SÖZÜ<br>
<!-- Attığım taş etti şak
Sakatat (Ya, ya)... --><br>
Bir numaralı fanınım büyük sanatçı filozof, koşa koşa gel sik beni bak video da yayınladık bir numaralı fanınız diye, o değil ama ben birinciyim, Bursa Mustafakemalpaşa sana hayran tüm instakalamarlarıyla...
    </div>
  </div>

</body>
</html>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 10px;
  height: 100vh;
  background: black;
  font-family:"Segoe UI", sans-serif;
  color:white;
}

.section {
  border-radius:12px;
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
  cursor:pointer;
}

/* Ortak medya */
.section img,
.section video {
  width:100%;
  height:100%;
  object-fit:contain; /* cover yerine contain */
  border-radius:12px;
  background:black; /* boşluk olursa siyah arka plan */
}


/* Audio gizli */
.section audio {
  display:none;
}

/* Text overlay */
.textBox {
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  max-height:40%;
  padding:10px;
  overflow-y:auto;
  font-size:14px;
  line-height:1.4;
  background:rgba(0,0,0,0.5);
  color:white;
}

/* Müzik Aç/Kapat butonu */
.playPauseBtn {
  position:absolute;
  top:10px;
  right:10px;
  padding:6px 12px;
  font-size:13px;
  background:rgba(0,0,0,0.7);
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
  z-index:10;
}
.playPauseBtn:hover {
  background:rgba(255,255,255,0.2);
}

/* 📱 Mobil uyum */
@media (max-width:768px) {
  body {
    grid-template-columns: 1fr;
    grid-template-rows: repeat(12, auto);
    height:auto;
  }
  .section {
    min-height:40vh;
  }
}
</style>
</head>

<script>
// Üst köşedeki butonlar müziği kontrol ediyor
const buttons = document.querySelectorAll('.playPauseBtn');
buttons.forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation(); // kutu tıklamasını engelle
    const targetId = btn.getAttribute('data-target');
    const media = document.getElementById(targetId);
    if(media){
      if(media.paused){
        media.play();
        btn.textContent = "Müzik Kapat";
      } else {
        media.pause();
        btn.textContent = "Müzik Aç";
      }
    }
  });
});

// Text dosyalarını yükle
for(let i=1;i<=12;i++){
  fetch(`assets/t${i}.txt`)
    .then(res => res.text())
    .then(data => {
      document.getElementById(`t${i}`).textContent = data;
    })
    .catch(()=>{}); // dosya yoksa boş bırak
}

// Fullscreen açma
function openFullscreen(el){
  const video = el.querySelector("video");
  const img = el.querySelector("img");

  if(video && video.src){ 
    // Video varsa, player kendi fullscreen tuşunu kullanır
    return;
  } else if(img){
    // Video yoksa, resim fullscreen açılır
    if(img.requestFullscreen){
      img.requestFullscreen();
    } else if(img.webkitRequestFullscreen){
      img.webkitRequestFullscreen();
    } else if(img.msRequestFullscreen){
      img.msRequestFullscreen();
    }
  }
}

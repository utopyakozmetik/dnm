<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>visual</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<!-- 📊 VERCEL ANALYTICS (FIXED) -->
<script>
  window.va = window.va || function () {
    (window.vaq = window.vaq || []).push(arguments);
  };
</script>
<script defer src="https://va.vercel-scripts.com/v1/script.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    background:black;
    font-family:'Playfair Display', serif;
}

/* 🌌 BACKGROUND */
.bg{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    transition:transform 0.05s linear, filter 0.08s linear;
}

/* 🧠 VIGNETTE */
.vignette{
    position:fixed;
    inset:0;
    z-index:-2;
    background:radial-gradient(circle at center, transparent 35%, rgba(0,0,0,0.85));
}

/* ================= TEXT SYSTEM ================= */

.text-base,
.text-glow,
.text-shake{
    position:fixed;
    top:50%;
    left:140px;
    font-size:42px; /* 🔥 küçültüldü */
    line-height:1.05;
    white-space:pre-line;
}

/* base */
.text-base{
    color:#ff2b2b;
    z-index:10;
    text-shadow:
    0 0 2px black,
    0 0 10px rgba(255,0,0,0.6),
    0 0 25px rgba(255,0,0,0.4);
}

/* glow */
.text-glow{
    color:transparent;
    z-index:11;
    pointer-events:none;
    text-shadow:0 0 45px rgba(255,0,0,0.6);
}

/* shake */
.text-shake{
    color:transparent;
    z-index:12;
    pointer-events:none;
}

/* 🎬 REELS FLOAT MOTION */
.text-base,
.text-glow,
.text-shake{
    animation: floatDown 6s linear infinite;
}

@keyframes floatDown{
    0%{ transform:translateY(-60%); }
    50%{ transform:translateY(-45%); }
    100%{ transform:translateY(-30%); }
}

/* 🔘 BUTTON */
.button{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    padding:14px 34px;
    border:1px solid rgba(255,255,255,0.7);
    background:rgba(0,0,0,0.4);
    color:white;
    font-family:'Inter';
    letter-spacing:3px;
    cursor:pointer;
    backdrop-filter:blur(10px);
    border-radius:10px;
    z-index:20;
}

/* 🩸 STAINS */
.stain-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
    mix-blend-mode:multiply;
}

.stain{
    position:absolute;
    width:220px;
    height:220px;
    background:radial-gradient(circle, rgba(120,0,0,0.4), transparent 70%);
    border-radius:50%;
    filter:blur(22px);
    animation:fade 0.6s ease;
}

@keyframes fade{
    from{opacity:0;transform:scale(0.4);}
    to{opacity:1;transform:scale(1);}
}
</style>
</head>

<body>

<div class="vignette"></div>

<img class="bg" id="bg" src="assets/background.jpg">

<div class="text-base" id="base">YOUR TEXT HERE</div>
<div class="text-glow" id="glow">YOUR TEXT HERE</div>
<div class="text-shake" id="shake">YOUR TEXT HERE</div>

<div class="stain-layer" id="stains"></div>

<button class="button" onclick="toggleMusic()">PLAY</button>

<audio id="audio" loop>
    <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("audio");

const base = document.getElementById("base");
const glow = document.getElementById("glow");
const shake = document.getElementById("shake");

const bg = document.getElementById("bg");
const stains = document.getElementById("stains");

let ctx, analyser, source, dataArray;
let playing = false;

/* 🎧 AUDIO INIT */
function initAudio(){
    ctx = new (window.AudioContext || window.webkitAudioContext)();

    analyser = ctx.createAnalyser();
    source = ctx.createMediaElementSource(audio);

    source.connect(analyser);
    analyser.connect(ctx.destination);

    analyser.fftSize = 256;
    dataArray = new Uint8Array(analyser.frequencyBinCount);

    loop();
}

/* 🩸 STAIN */
function spawnStain(p){
    const s = document.createElement("div");
    s.className = "stain";

    let size = 120 + p*260;

    s.style.left = Math.random()*innerWidth + "px";
    s.style.top = Math.random()*innerHeight + "px";
    s.style.width = size + "px";
    s.style.height = size + "px";

    stains.appendChild(s);

    if(stains.children.length > 18){
        stains.removeChild(stains.firstChild);
    }
}

/* 🔥 LOOP */
function loop(){
    requestAnimationFrame(loop);

    analyser.getByteFrequencyData(dataArray);

    let bass=0, mid=0, treble=0;

    for(let i=0;i<dataArray.length;i++){
        if(i<20) bass += dataArray[i];
        else if(i<80) mid += dataArray[i];
        else treble += dataArray[i];
    }

    bass/=20; mid/=60; treble/= (dataArray.length-80);

    bass=Math.pow(bass/255,2.2);
    mid=Math.pow(mid/255,1.8);
    treble=Math.pow(treble/255,1.6);

    let scale = 1 + bass*0.5;
    let shakeX = mid*10;
    let shakeY = mid*8;

    /* 🎯 TEXT MOTION (SAFE) */
    shake.style.transform =
    `translate(calc(-50% + ${shakeX}px), calc(-50% + ${shakeY}px)) scale(${scale})`;

    glow.style.filter =
    `drop-shadow(0 0 ${(bass+treble)*90}px rgba(255,0,0,0.8))`;

    base.style.transform =
    `translateY(-50%) scale(${scale})`;

    /* 🌌 BACKGROUND CINEMATIC */
    let bgX = (mid - bass) * 10;
    let bgY = (treble - mid) * 8;

    bg.style.transform =
    `scale(${1 + bass*0.1}) translate(${bgX}px, ${bgY}px)`;

    bg.style.filter =
    `brightness(${1 + bass*0.5})
     contrast(${1 + treble*0.5})
     saturate(${1 + mid*0.7})
     hue-rotate(${(treble-bass)*30}deg)`;

    /* 🩸 STAIN */
    if(mid > 0.6 && Math.random() > 0.8){
        spawnStain(mid);
    }
}

/* ▶️ PLAY */
function toggleMusic(){
    if(!playing){
        audio.play().then(()=>{
            if(!ctx) initAudio();
        });
        playing = true;
    } else {
        audio.pause();
        playing = false;
    }
}
</script>

</body>
</html>

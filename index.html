<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coming either soon or not soon...</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<script defer src="https://va.vercel-scripts.com/v1/script.js"></script>

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body {
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    padding-left:10vw;
    color:white;
    font-family:'Playfair Display', serif;
    overflow:hidden;
    background:black;
    transition: transform 0.05s linear;
}

/* BACKGROUND */
.bg {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    z-index:-2;
    transform:scale(1);
    transition: transform 0.08s linear, opacity 1s ease;
}

/* OVERLAY */
.overlay {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.35);
    z-index:-1;
    transition: background 0.08s linear;
}

/* CONTAINER */
.container {
    max-width:800px;
}

/* TEXT */
.response {
    font-size:56px;
    position:relative;
    color:#ff2b2b;
    text-shadow:0 0 15px rgba(255,0,0,0.25);
    transition: transform 0.08s linear, filter 0.08s linear;
}

/* GLITCH */
.response::before {
    content: attr(data-text);
    position:absolute;
    left:0;
    top:0;
    color:rgba(255,0,0,0.3);
    animation:glitch 3s infinite;
}

@keyframes glitch {
    0%,100% { transform:translate(0); opacity:0.2; }
    50% { transform:translate(2px,-1px); opacity:0.4; }
}

/* DOTS */
.dots::after {
    content:"...";
    animation:blink 1.2s infinite;
}

@keyframes blink {
    0%,100% { opacity:0; }
    50% { opacity:1; }
}

/* BUTTON */
.button {
    margin-top:60px;
    padding:12px 26px;
    border:1px solid rgba(255,255,255,0.6);
    background:transparent;
    color:white;
    font-family:'Inter';
    letter-spacing:2px;
    cursor:pointer;
}

/* TRACK */
.track {
    position:fixed;
    right:20px;
    bottom:20px;

    font-family:'Inter';
    font-size:13px;
    opacity:0.6;

    padding:6px 10px;
    border:1px solid rgba(255,255,255,0.15);
    border-radius:6px;

    backdrop-filter:blur(6px);
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<img class="bg" id="bg" src="assets/background.jpg">
<div class="overlay"></div>

<div class="container">

    <div class="response" data-text="Nadanı arzulamayan...">
        Nadanı arzulamayan<span class="dots"></span>
    </div>

    <button class="button" onclick="toggleMusic()">PLAY</button>

</div>

<!-- TRACK -->
<div class="track" id="trackName"></div>

<!-- AUDIO -->
<audio id="music" loop preload="auto" crossorigin="anonymous">
    <source src="assets/music.flac?v=3" type="audio/x-flac">
    <source src="assets/music.mp3?v=3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("music");
const btn = document.querySelector(".button");
const text = document.querySelector(".response");
const bg = document.getElementById("bg");
const overlay = document.querySelector(".overlay");
const track = document.getElementById("trackName");

let playing = false;
let ctx, analyser, source, dataArray;

/* TRACK NAME */
function setTrackName() {
    const src = audio.querySelector("source");
    let name = src.getAttribute("src")
        .split("/")
        .pop()
        .replace(/\?.*$/, "")
        .replace(/\.(mp3|flac|wav)/, "");

    track.textContent = "♪ " + name;
}

/* AUDIO INIT */
function initAudio() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = ctx.createAnalyser();

    source = ctx.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(ctx.destination);

    analyser.fftSize = 256;
    dataArray = new Uint8Array(analyser.frequencyBinCount);

    loop();
}

/* BEAT LOOP */
function loop() {
    requestAnimationFrame(loop);

    analyser.getByteFrequencyData(dataArray);

    let bass = 0;
    for (let i = 2; i < 15; i++) {
        bass += dataArray[i];
    }
    bass /= 13;

    // TEXT
    let scale = 1 + (bass / 255) * 0.35;
    let glow = (bass / 255) * 25;

    text.style.transform = `scale(${scale})`;
    text.style.filter = `drop-shadow(0 0 ${glow}px rgba(255,0,0,0.7))`;

    // BACKGROUND ZOOM
    let bgScale = 1 + (bass / 255) * 0.05;
    bg.style.transform = `scale(${bgScale})`;

    // SHAKE
    let shake = (bass / 255) * 4;
    document.body.style.transform = `translate(${shake}px, ${shake}px)`;

    // LIGHT PULSE
    overlay.style.background = `rgba(0,0,0,${0.35 + (bass/255)*0.25})`;
}

/* MUSIC */
function startMusic() {
    audio.volume = 0;
    audio.play();

    let v = 0;
    let fade = setInterval(() => {
        if (v < 0.6) {
            v += 0.05;
            audio.volume = v;
        } else {
            clearInterval(fade);
        }
    }, 120);

    if (!ctx) initAudio();
}

/* BUTTON */
function toggleMusic() {
    if (!playing) {
        startMusic();
        btn.textContent = "PAUSE";
        playing = true;
    } else {
        audio.pause();
        btn.textContent = "PLAY";
        playing = false;
    }
}

/* INIT */
window.addEventListener("DOMContentLoaded", () => {
    setTrackName();

    const p = audio.play();
    if (p !== undefined) {
        p.then(() => {
            startMusic();
            btn.textContent = "PAUSE";
            playing = true;
        }).catch(() => {});
    }
});
</script>

</body>
</html>

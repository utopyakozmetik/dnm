<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6 Bölmeli Grid Düzen</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body {
  display: grid;
  grid-template-columns: repeat(3, 1fr); /* 3 sütun */
  grid-template-rows: repeat(2, 1fr);    /* 2 satır */
  gap: 10px;
  height: 100vh;
  background: black;
  font-family:"Segoe UI", sans-serif;
  color:white;
}

/* Genel kutu stili */
.section {
  border-radius:12px;
  overflow:hidden;
  background:rgba(20,20,20,0.85);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
}

/* Görseller */
.section img {
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:12px;
}

/* Videolar */
.section video {
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:12px;
}

/* Buton */
.playPauseBtn {
  position:absolute;
  top:10px;
  right:10px;
  padding:8px 16px;
  font-size:14px;
  background:rgba(0,0,0,0.7);
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
.playPauseBtn:hover {
  background:rgba(255,255,255,0.2);
}

/* 📱 Mobil uyum: tek sütun, 6 satır */
@media (max-width:768px) {
  body {
    grid-template-columns: 1fr;
    grid-template-rows: repeat(6, auto);
    height:auto;
  }
  .section {
    min-height:40vh;
  }
}
</style>
</head>
<body>

  <!-- ÜSTTE 3 GÖRSEL + MÜZİK -->
  <div class="section">
    <button class="playPauseBtn" data-target="m1">Play</button>
    <img src="assets/resim1.jpeg" alt="Resim 1">
    <audio id="m1">
      <source src="assets/m1.mp3" type="audio/mpeg">
    </audio>
  </div>
  <div class="section">
    <button class="playPauseBtn" data-target="m2">Play</button>
    <img src="assets/resim2.jpeg" alt="Resim 2">
    <audio id="m2">
      <source src="assets/m2.mp3" type="audio/mpeg">
    </audio>
  </div>
  <div class="section">
    <button class="playPauseBtn" data-target="m3">Play</button>
    <img src="assets/resim3.jpeg" alt="Resim 3">
    <audio id="m3">
      <source src="assets/m3.mp3" type="audio/mpeg">
    </audio>
  </div>

  <!-- ALTA 3 VİDEO -->
  <div class="section">
    <video id="video1" controls playsinline>
      <source src="assets/video1.mp4" type="video/mp4">
    </video>
  </div>
  <div class="section">
    <video id="video2" controls playsinline>
      <source src="assets/video2.mp4" type="video/mp4">
    </video>
  </div>
  <div class="section">
    <video id="video3" controls playsinline>
      <source src="assets/video3.mp4" type="video/mp4">
    </video>
  </div>

<script>
const buttons = document.querySelectorAll('.playPauseBtn');
buttons.forEach(btn => {
  btn.addEventListener('click', () => {
    const targetId = btn.getAttribute('data-target');
    const audio = document.getElementById(targetId);
    if(audio.paused){
      audio.play();
      btn.textContent = "Pause";
    } else {
      audio.pause();
      btn.textContent = "Play";
    }
  });
});
</script>

</body>
</html>

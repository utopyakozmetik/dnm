<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body {
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    padding-left:10vw;
    color:white;
    overflow:hidden;

    font-family:'Playfair Display', serif;

    background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.85)),
                url('assets/background.jpg') no-repeat center center/cover;
}

/* container */
.container {
    max-width:700px;
}

/* text */
.quote {
    font-size:64px;
    margin-bottom:20px;
    opacity:0;
    animation:fadeIn 1.2s ease forwards;
}

.author {
    font-family:'Inter';
    font-size:18px;
    opacity:0.6;
    margin-bottom:40px;
    opacity:0;
    animation:fadeIn 1.2s ease forwards;
    animation-delay:0.5s;
}

.response {
    font-size:42px;
    opacity:0;
    animation:fadeIn 1.2s ease forwards;
    animation-delay:1.2s;
}

/* dots */
.dots::after {
    content:"...";
    animation:blink 1.2s infinite;
}

@keyframes blink {
    0%, 100% { opacity:0; }
    50% { opacity:1; }
}

/* button */
.button {
    margin-top:60px;
    padding:12px 26px;
    border:1px solid rgba(255,255,255,0.6);
    background:transparent;
    color:white;
    font-family:'Inter';
    cursor:pointer;
    letter-spacing:2px;
    transition:0.3s;
    opacity:0;
    animation:fadeIn 1.2s ease forwards;
    animation-delay:2s;
}

.button:hover {
    background:white;
    color:black;
}

/* fade */
@keyframes fadeIn {
    to {
        opacity:1;
        transform:none;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="quote">"God is dead."</div>
    <div class="author">— Nietzsche</div>

    <div class="response">
        "No, I am not, you jealous bitch<span class="dots"></span>"
    </div>

    <button class="button" onclick="toggleMusic()">PLAY</button>
</div>

<audio id="music" loop>
    <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<script>
let playing = false;

function toggleMusic() {
    const audio = document.getElementById("music");
    const btn = document.querySelector(".button");

    if (!playing) {
        audio.volume = 0;
        audio.play();

        // fade in
        let v = 0;
        let fade = setInterval(() => {
            if (v < 0.6) {
                v += 0.05;
                audio.volume = v;
            } else {
                clearInterval(fade);
            }
        }, 150);

        btn.textContent = "PAUSE";
        playing = true;

    } else {
        audio.pause();
        btn.textContent = "PLAY";
        playing = false;
    }
}
</script>

</body>
</html>

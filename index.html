<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>visual</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body {
    height:100vh;
    overflow:hidden;
    background:black;
    font-family:'Playfair Display', serif;
}

/* BACKGROUND */
.bg {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    z-index:-1;
    transition:transform 0.05s linear;
}

/* MAIN TEXT */
.response {
    position:fixed;
    top:50%;
    left:60px;
    transform:translateY(-50%);
    font-size:64px;
    color:#ff2b2b;
    line-height:1.05;
    text-shadow:0 0 25px rgba(255,0,0,0.4);
    z-index:2;
}

/* BUTTON */
.button {
    position:absolute;
    bottom:80px;
    left:40px;
    padding:12px 26px;
    border:1px solid rgba(255,255,255,0.6);
    background:transparent;
    color:white;
    font-family:'Inter';
    letter-spacing:2px;
    cursor:pointer;
}

/* TRACK */
.track {
    position:fixed;
    right:20px;
    bottom:20px;
    font-family:'Inter';
    font-size:13px;
    opacity:0.6;
    padding:6px 10px;
    border:1px solid rgba(255,255,255,0.15);
    border-radius:6px;
    backdrop-filter:blur(6px);
}

/* STAINS */
.stain-layer {
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
    mix-blend-mode:multiply;
}

.stain {
    position:absolute;
    width:200px;
    height:200px;
    background:radial-gradient(circle, rgba(120,0,0,0.35), transparent 70%);
    border-radius:50%;
    filter:blur(20px);
    animation:fade 0.6s ease;
}

@keyframes fade {
    from { opacity:0; transform:scale(0.5); }
    to { opacity:1; transform:scale(1); }
}
</style>
</head>

<body>

<img class="bg" id="bg" src="assets/background.jpg">

<div class="response" id="text">
<!-- 🔴 Where do I take this pain of mine?<br>
I run but it stays right my side<br><br>
So tear me open, pour me out<br>
There's things inside that scream and shout<br>
And the pain still hates me<br>
So hold me, until it sleeps<br><br>
Just like the curse, just like the stray<br>
You feed it once and now it stays, now it stays<br>
So tear me open but beware<br>
There's things inside without a care<br>
And the dirt still stains me<br>
SO WASH ME , UNTIL I'M CLEAN<br><br>
It grips you, so hold me<br>
It stains you, so hold me<br>
It hates you, so hold me<br>
It holds you, so hold me<br>
Until it sleeps (until it sleeps, until it sleeps)<br><br>
So tell me why you've chosen me<br>
Don't want your grip, don't want your greed, don't want it<br>
I'll tear me open, make you gone<br>
No more can you hurt anyone<br>
And the fear still shakes me<br>
So hold me, until it sleeps<br><br>

</div>

<div class="stain-layer" id="stains"></div>

<button class="button" onclick="toggleMusic()">PLAY</button>
<div class="track" id="track"></div>

<audio id="audio" loop>
    <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("audio");
const text = document.getElementById("text");
const bg = document.getElementById("bg");
const track = document.getElementById("track");
const stains = document.getElementById("stains");

let ctx, analyser, source, dataArray;
let playing = false;
let last = -1;

/* LYRIC TRIGGERS (istersen genişlet) */
const points = [
  { t: 10 },
  { t: 18 },
  { t: 26 },
  { t: 40 }
];

/* STAIN */
function spawnStain(p) {
    const s = document.createElement("div");
    s.className = "stain";
    s.style.left = Math.random()*innerWidth + "px";
    s.style.top = Math.random()*innerHeight + "px";
    s.style.width = 100 + p*200 + "px";
    s.style.height = 100 + p*200 + "px";

    stains.appendChild(s);

    if (stains.children.length > 12)
        stains.removeChild(stains.firstChild);
}

/* EXPLODE */
function explode() {
    text.style.transform += " scale(1.5)";
    text.style.filter = "brightness(2) blur(2px)";
    bg.style.transform += " scale(1.1)";
    spawnStain(1);

    setTimeout(() => text.style.filter = "", 120);
}

/* AUDIO INIT */
function init() {
    ctx = new AudioContext();
    analyser = ctx.createAnalyser();
    source = ctx.createMediaElementSource(audio);

    source.connect(analyser);
    analyser.connect(ctx.destination);

    analyser.fftSize = 256;
    dataArray = new Uint8Array(analyser.frequencyBinCount);

    loop();
}

/* SYNC */
function sync() {
    const t = audio.currentTime;
    points.forEach((p,i)=>{
        if(Math.abs(t - p.t) < 0.15 && last !== i){
            explode();
            last = i;
        }
    });
}

/* LOOP */
function loop(){
    requestAnimationFrame(loop);

    analyser.getByteFrequencyData(dataArray);

    let bass=0,mid=0,treble=0;

    for(let i=0;i<dataArray.length;i++){
        if(i<20) bass+=dataArray[i];
        else if(i<80) mid+=dataArray[i];
        else treble+=dataArray[i];
    }

    bass/=20; mid/=60; treble/= (dataArray.length-80);

    bass=Math.pow(bass/255,1.5);
    mid=Math.pow(mid/255,1.3);
    treble=Math.pow(treble/255,1.1);

    let scale = 1 + bass*0.6;
    let shake = mid*10;
    let glow = (bass+treble)*60;

    text.style.transform =
    `translateY(-50%) translate(${shake}px,${-shake}px) scale(${scale})`;

    text.style.filter =
    `drop-shadow(0 0 ${glow}px rgba(255,0,0,0.9))`;

    bg.style.transform =
    `scale(${1 + bass*0.08})`;

    if(treble > 0.6){
        text.style.textShadow = "3px 0 red,-3px 0 blue";
    } else {
        text.style.textShadow = "0 0 25px rgba(255,0,0,0.4)";
    }

    if(mid > 0.5 && Math.random()>0.7){
        spawnStain(mid);
    }

    sync();
}

/* PLAY */
function play(){
    audio.play();
    if(!ctx) init();
}

/* TOGGLE */
function toggleMusic(){
    if(!playing){
        play();
        playing=true;
    } else {
        audio.pause();
        playing=false;
    }
}

/* INIT */
window.onload=()=>{
    track.textContent="♪ asset track";
};
</script>

</body>
</html>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body {
  display:grid;
  grid-template-columns:repeat(4,1fr); /* 4x4 */
  grid-template-rows:repeat(4,1fr);
  gap:10px;
  height:100vh;
  background:black;
  font-family:"Segoe UI",sans-serif;
  color:white;
}

.section {
  border-radius:12px;
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
  cursor:pointer;
}

/* medya */
.section img,
.section video,
.section iframe {
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:12px;
  background:black;
  border:none;
}

.section audio {display:none;}

.textBox {
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  max-height:40%;
  padding:10px;
  overflow-y:auto;
  font-size:14px;
  background:rgba(0,0,0,0.5);
}

/* müzik */
.playPauseBtn {
  position:absolute;
  top:10px;
  right:10px;
  padding:6px 12px;
  font-size:13px;
  background:rgba(0,0,0,0.7);
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
  z-index:10;
}

/* iframe placeholder */
.video-placeholder {
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  background:black;
  color:white;
}

/* mobil */
@media (max-width:768px){
  body{
    grid-template-columns:1fr;
    grid-template-rows:none;
    height:auto;
  }
  .section{min-height:35vh;}
}
</style>
</head>

<script>

/* müzik */
document.querySelectorAll('.playPauseBtn').forEach(btn=>{
  btn.onclick=(e)=>{
    e.stopPropagation();
    const a=document.getElementById(btn.dataset.target);
    if(a.paused){a.play();btn.textContent="Müzik Kapat";}
    else{a.pause();btn.textContent="Müzik Aç";}
  }
});

/* text */
for(let i=1;i<=16;i++){
  fetch(`assets/t${i}.txt`)
    .then(r=>r.text())
    .then(t=>{
      const el=document.getElementById(`t${i}`);
      if(el) el.textContent=t;
    })
    .catch(()=>{});
}

/* iframe lazy load */
document.querySelectorAll(".video-box").forEach(box=>{
  box.addEventListener("click",function(){

    if(this.querySelector("iframe")) return;

    const iframe=document.createElement("iframe");
    iframe.src=this.dataset.src+"?autoplay=0";
    iframe.allow="encrypted-media";
    iframe.allowFullscreen=true;
    iframe.style.width="100%";
    iframe.style.height="100%";
    iframe.style.border="none";

    this.innerHTML="";
    this.appendChild(iframe);
  });
});

/* fullscreen */
function openFullscreen(el){
  const iframe=el.querySelector("iframe");
  if(iframe){iframe.requestFullscreen?.();return;}

  const video=el.querySelector("video");
  if(video){video.requestFullscreen?.();return;}

  const img=el.querySelector("img");
  if(img){img.requestFullscreen?.();}
}

</script>
